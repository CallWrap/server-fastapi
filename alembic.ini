[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# DB URL은 여기 적지 않는다. migrations/env.py가 settings에서 읽는다
# (.env 하나만 관리하면 되도록 — sqlalchemy.url을 비워두는 게 의도다).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
