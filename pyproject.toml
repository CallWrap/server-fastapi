[project]
name = "callwrap-api"
version = "0.1.0"
description = "CallWrap 무상태 워커 — 품질 게이트(②)·파이프라인·AI 분석 호출. Spring↔RabbitMQ 연동, DB는 Spring 소유"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "callwrap-ai",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# callwrap-ai는 예시(stub) 패키지를 로컬 경로로 물린다. api/는 analyze()와 schemas만 쓴다.
# 실제 모델(AI-model 레포) 완성 시 이 한 줄만 git 소스로 교체한다. 예:
#   callwrap-ai = { git = "https://github.com/CallWrap/AI-model.git" }
[tool.uv.sources]
callwrap-ai = { path = "stubs/callwrap-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callwrap_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
