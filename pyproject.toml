[project]
name = "callwrap-api"
version = "0.1.0"
description = "CallWrap 무상태 워커 — 품질 게이트(②)·파이프라인·AI 분석 호출. Spring↔RabbitMQ 연동, DB는 Spring 소유"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "pyyaml>=6.0",
    "boto3>=1.34",
    # [train] extra를 반드시 붙인다. callwrap-ai 기본 의존성은 pydantic뿐이라 torch·transformers가
    # 안 깔리고, 그러면 classify.py의 지연 import가 ImportError를 삼켜 None을 돌린다 — F2 중분류·
    # 소분류가 **조용히** 항상 부분 실패(failures=["classify_category", ...])로 넘어간다.
    # 체크포인트를 /app/models에 아무리 잘 마운트해도 소용없다. extra 이름이 "train"이라 학습 전용처럼
    # 보이지만 실제 내용물은 torch+transformers+sklearn이고, 추론에도 앞의 둘이 그대로 필요하다.
    "callwrap-ai[train]",
    "httpx>=0.27",  # FAQ 배치 생성기(routers/faq.py)가 Spring 내부 API를 호출할 때 씀
]

[dependency-groups]
dev = [
    "pytest>=8",
    # httpx는 이제 메인 의존성(위 dependencies)에 있어서 여기 안 둬도 되지만,
    # 테스트에서 TestClient가 httpx를 요구해 명시적으로 남겨둔다.
    "httpx>=0.27",
]
# 실 STT 백엔드(stt_backend="whisper")용 무거운 ML 의존성. 기본 워커엔 안 깔린다.
# 설치: uv sync --group stt   (pyannote 게이트 모델은 HF_TOKEN 필요)
stt = [
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1,<4",   # 4.x는 기본 파이프라인을 게이트 community-1로 바꿈 — 3.x 유지(segmentation-3.0)
    "torch>=2.1,<2.3",          # pyannote 3.x는 옛 torchaudio API(AudioMetaData) 기대 — 버전 고정
    "torchaudio>=2.1,<2.3",
    "numpy<2",                  # torch 2.2는 numpy 1.x 빌드 — numpy 2.x면 torch.from_numpy 깨짐
    "huggingface_hub<0.28",     # 0.28에서 use_auth_token 제거 — pyannote 3.x가 아직 그 인자를 씀
    "soundfile>=0.12",   # 오디오 로드 (ffmpeg 없이 libsndfile로 wav/aiff/flac)
]

# callwrap-ai는 실제 모델(AI-model 레포)을 git 소스로 문다. api/는 analyze()와 schemas만 쓴다.
# uv.lock이 커밋 해시까지 고정하므로, AI-model에 변경이 머지되면 여기서도 다시 잠가야 반영된다:
#   uv lock --upgrade-package callwrap-ai
# (stubs/callwrap-ai는 이 전환 이전에 쓰던 예시 패키지라 지금은 아무도 참조하지 않는다.)
[tool.uv.sources]
callwrap-ai = { git = "https://github.com/CallWrap/AI-model.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callwrap_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
