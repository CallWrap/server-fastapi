[project]
name = "callwrap-api"
version = "0.1.0"
description = "CallWrap 무상태 워커 — 품질 게이트(②)·파이프라인·AI 분석 호출. Spring↔RabbitMQ 연동, DB는 Spring 소유"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "celery>=5.4",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "callwrap-ai",
    "httpx>=0.27",  # FAQ 배치 생성기(routers/faq.py)가 Spring 내부 API를 호출할 때 씀
]

[dependency-groups]
dev = [
    "pytest>=8",
    # httpx는 이제 메인 의존성(위 dependencies)에 있어서 여기 안 둬도 되지만,
    # 테스트에서 TestClient가 httpx를 요구해 명시적으로 남겨둔다.
    "httpx>=0.27",
]
# 실 STT 백엔드(stt_backend="whisper")용 무거운 ML 의존성. 기본 워커엔 안 깔린다.
# 설치: uv sync --group stt   (pyannote 게이트 모델은 HF_TOKEN 필요)
stt = [
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1,<4",   # 4.x는 기본 파이프라인을 게이트 community-1로 바꿈 — 3.x 유지(segmentation-3.0)
    "torch>=2.1,<2.3",          # pyannote 3.x는 옛 torchaudio API(AudioMetaData) 기대 — 버전 고정
    "torchaudio>=2.1,<2.3",
    "numpy<2",                  # torch 2.2는 numpy 1.x 빌드 — numpy 2.x면 torch.from_numpy 깨짐
    "huggingface_hub<0.28",     # 0.28에서 use_auth_token 제거 — pyannote 3.x가 아직 그 인자를 씀
    "soundfile>=0.12",   # 오디오 로드 (ffmpeg 없이 libsndfile로 wav/aiff/flac)
]

# callwrap-ai는 예시(stub) 패키지를 로컬 경로로 물린다. api/는 analyze()와 schemas만 쓴다.
# 실제 모델(AI-model 레포) 완성 시 이 한 줄만 git 소스로 교체한다. 예:
#   callwrap-ai = { git = "https://github.com/CallWrap/AI-model.git" }
[tool.uv.sources]
callwrap-ai = { git = "https://github.com/CallWrap/AI-model.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callwrap_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
