# 개발용 스택. 실행: cd api && docker compose up -d
#
# api/worker는 소스를 볼륨으로 물려서 코드 수정이 바로 반영된다.
# 실서비스 배포용이 아니다 — Week 7에 별도로 정리한다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callwrap
      POSTGRES_PASSWORD: callwrap
      POSTGRES_DB: callwrap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callwrap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: >
      uv run uvicorn callwrap_api.main:app 
      --host 0.0.0.0 
      --port 8000 
      --reload 
      --reload-exclude "*.pyc" 
      --reload-exclude "__pycache__/*"
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://callwrap:callwrap@postgres:5432/callwrap
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/api/src
      - ./config:/app/api/config
      - ../ai/src:/app/ai/src
      - audio_data:/app/api/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: uv run celery -A callwrap_api.tasks.app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://callwrap:callwrap@postgres:5432/callwrap
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/api/src
      - ./config:/app/api/config
      - ../ai/src:/app/ai/src
      # api가 저장한 음성 파일을 워커가 읽어야 한다 — 같은 볼륨을 공유한다.
      - audio_data:/app/api/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  audio_data:
