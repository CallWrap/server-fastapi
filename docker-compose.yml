# 개발용 스택. 실행: docker compose up -d
#
# RabbitMQ는 이 레포에서 안 띄운다 — Spring의 docker-compose.yml에서 뜬 것을 공유해서 쓴다.
# 로컬 개발 시 Spring 쪽을 먼저 `docker compose up -d`로 띄워둬야 이 스택이 정상 동작한다.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    command: >
      uv run uvicorn callwrap_api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-exclude "*.pyc"
      --reload-exclude "__pycache__/*"
    ports:
      - "8001:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672//
      # FAQ 배치 생성기(routers/faq.py)가 Spring 내부 API(/api/internal/faq/*)를 호출할 때 씀.
      SPRING_API_BASE_URL: ${SPRING_API_BASE_URL:-http://host.docker.internal:8080}
      # 요약/후속처리/FAQ와 마찬가지로 EXAONE(Ollama) 호출이 필요 — 소분류당 최소 후보 건수도 같이 둔다.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      FAQ_MIN_GROUP_SIZE: ${FAQ_MIN_GROUP_SIZE:-3}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    command: uv run celery -A callwrap_api.tasks.app.celery_app worker --loglevel=info
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672//
      AUDIO_SOURCE: s3
      S3_ENDPOINT_URL: http://host.docker.internal:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # 실제 STT 돌리는 서비스라 여기만 필요. 값은 이 파일과 같은 폴더의 .env에서 읽어온다
      # (docker compose가 자동으로 읽는 .env — 없으면 STT_BACKEND/WHISPER_MODEL은 기본값으로,
      #  HF_TOKEN은 빈 값으로 들어가 pyannote 게이트 모델 다운로드가 실패한다).
      STT_BACKEND: ${STT_BACKEND:-whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      HF_TOKEN: ${HF_TOKEN}
      # 요약/후속처리/FAQ(EXAONE) 호출용. 컨테이너 안에서 127.0.0.1은 컨테이너 자신을
      # 가리키므로, 호스트(또는 다른 곳)에서 도는 Ollama에 닿으려면 host.docker.internal이 필요하다.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # F2(중분류·소분류) 분류 모델 체크포인트 경로. classify.py의 기본값(DEFAULT_MODEL_DIR)은
      # callwrap-ai가 git 의존성으로 설치된 venv 내부 경로라 컨테이너 안에 실제로 존재하지 않는다
      # (docker compose exec worker uv run python3 -c "from callwrap_ai import classify;
      #  print(classify.model_dir(), classify.model_dir().exists())" → False로 확인됨).
      # 그래서 아래 볼륨 마운트가 채워주는 /app/models로 오버라이드한다. 체크포인트는 AI-model이
      # 성진 말대로 "로컬에서 재현 학습"하는 구조라 이 레포는 실행 결과물이 없다 — CALLWRAP_MODEL_DIR_HOST를
      # .env에서 실제 체크포인트가 있는 경로로 지정해야 이 마운트가 의미가 생긴다. 비워두면 빈 폴더가
      # 마운트되고 classify.py가 지금처럼 None을 돌려 부분 실패(classify_category 등)로 넘어간다.
      CALLWRAP_MODEL_DIR: /app/models
    volumes:
      - ${CALLWRAP_MODEL_DIR_HOST:-./.model-cache}:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    command: uv run python -m callwrap_api.messaging.consumer
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672//
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - audio_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  audio_data:

secrets:
  # AI-model(비공개 레포)을 git으로 받아오기 위한 GitHub PAT.
  # server-fastapi/.github_token 파일(gitignore 처리됨)에 토큰 한 줄만 넣어두면 된다.
  github_token:
    file: ./.github_token