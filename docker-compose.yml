# 개발용 스택. 실행: docker compose up -d
#
# RabbitMQ는 이 레포에서 안 띄운다 — Spring의 docker-compose.yml에서 뜬 것을 공유해서 쓴다.
# 로컬 개발 시 Spring 쪽을 먼저 `docker compose up -d`로 띄워둬야 이 스택이 정상 동작한다.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uv run uvicorn callwrap_api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-exclude "*.pyc"
      --reload-exclude "__pycache__/*"
    ports:
      - "8001:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672//
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run celery -A callwrap_api.tasks.app.celery_app worker --loglevel=info
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672//
      AUDIO_SOURCE: s3
      S3_ENDPOINT_URL: http://host.docker.internal:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m callwrap_api.messaging.consumer
    environment:
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672//
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - audio_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  audio_data: